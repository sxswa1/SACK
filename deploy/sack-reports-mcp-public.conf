# Install at /etc/systemd/system/sack-reports-mcp.service.d/public.conf.
# Nginx terminates TLS; the MCP process remains bound to loopback.
[Service]
ExecStart=
ExecStart=/opt/sack-tugraph-runtime-20261015/mcp-venv/bin/python -m sack.mcp --host 127.0.0.1 --port 8765 --allowed-host 127.0.0.1:* --allowed-host localhost:* --allowed-host mcp.bdilabagent.cn --allowed-origin https://mcp.bdilabagent.cn
